<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý người dùng - React CRUD</title>
  <!-- React, ReactDOM & Babel Standalone via CDN (chạy trực tiếp trên localhost & GitHub Pages) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background-color: #f4f6f9;
      color: #222;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px 28px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 26px;
      color: #1a202c;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 12px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 240px;
      max-width: 380px;
      padding: 10px 14px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #3182ce;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.2s, transform 0.05s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: #2b6cb0;
      color: #fff;
      padding: 10px 18px;
    }

    .btn-edit {
      background-color: #ed8936;
      color: #fff;
      margin-right: 6px;
    }

    .btn-delete {
      background-color: #e53e3e;
      color: #fff;
    }

    .btn-save {
      background-color: #38a169;
      color: #fff;
    }

    .btn-cancel {
      background-color: #a0aec0;
      color: #fff;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 4px;
      font-size: 14px;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background-color: #f7fafc;
      color: #4a5568;
      font-weight: 600;
      white-space: nowrap;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .status-msg {
      text-align: center;
      padding: 24px;
      color: #718096;
      font-style: italic;
    }

    /* Modal Overlay & Modal Content (Bước 8) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-content {
      background: #fff;
      padding: 22px 24px;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .modal-content h4 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 18px;
      color: #1a202c;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #4a5568;
    }

    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 14px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #3182ce;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // BƯỚC 3: Component SearchForm
    function SearchForm({ onChangeValue }) {
      return (
        <input
          className="search-input"
          type="text"
          placeholder="Tìm theo name, username..."
          onChange={(e) => onChangeValue(e.target.value)}
        />
      );
    }

    // BƯỚC 5: Component AddUser (Modal Form + Nested State Address)
    function AddUser({ onAdd }) {
      const [adding, setAdding] = React.useState(false);
      const initialUser = {
        name: "",
        username: "",
        email: "",
        address: {
          street: "",
          suite: "",
          city: ""
        },
        phone: "",
        website: ""
      };
      const [user, setUser] = React.useState(initialUser);

      const handleChange = (e) => {
        const { id, value } = e.target;
        if (["street", "suite", "city"].includes(id)) {
          setUser({
            ...user,
            address: {
              ...user.address,
              [id]: value
            }
          });
        } else {
          setUser({
            ...user,
            [id]: value
          });
        }
      };

      const handleAdd = () => {
        if (user.name.trim() === "" || user.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        onAdd(user);
        setUser(initialUser);
        setAdding(false);
      };

      const handleCancel = () => {
        setUser(initialUser);
        setAdding(false);
      };

      return (
        <div>
          <button className="btn-primary" onClick={() => setAdding(true)}>
            + Thêm người dùng
          </button>

          {adding && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h4>Thêm người dùng</h4>

                <div className="form-group">
                  <label htmlFor="name">Name *</label>
                  <input id="name" type="text" value={user.name} onChange={handleChange} placeholder="Nhập họ tên" />
                </div>

                <div className="form-group">
                  <label htmlFor="username">Username *</label>
                  <input id="username" type="text" value={user.username} onChange={handleChange} placeholder="Nhập username" />
                </div>

                <div className="form-group">
                  <label htmlFor="email">Email</label>
                  <input id="email" type="email" value={user.email} onChange={handleChange} placeholder="example@email.com" />
                </div>

                <div className="form-group">
                  <label htmlFor="street">Street (Đường)</label>
                  <input id="street" type="text" value={user.address.street} onChange={handleChange} placeholder="Tên đường" />
                </div>

                <div className="form-group">
                  <label htmlFor="suite">Suite (Căn hộ / Tòa nhà)</label>
                  <input id="suite" type="text" value={user.address.suite} onChange={handleChange} placeholder="Số nhà / Căn hộ" />
                </div>

                <div className="form-group">
                  <label htmlFor="city">City (Thành phố)</label>
                  <input id="city" type="text" value={user.address.city} onChange={handleChange} placeholder="Thành phố" />
                </div>

                <div className="form-group">
                  <label htmlFor="phone">Phone (Số điện thoại)</label>
                  <input id="phone" type="text" value={user.phone} onChange={handleChange} placeholder="Số điện thoại" />
                </div>

                <div className="form-group">
                  <label htmlFor="website">Website</label>
                  <input id="website" type="text" value={user.website} onChange={handleChange} placeholder="website.com" />
                </div>

                <div className="modal-actions">
                  <button className="btn-cancel" onClick={handleCancel}>Hủy</button>
                  <button className="btn-save" onClick={handleAdd}>Thêm</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // BƯỚC 4, 5, 6, 7: Component ResultTable (Hiển thị, Lọc, Thêm, Sửa, Xóa)
    function ResultTable({ keyword, user, onAdded }) {
      const [users, setUsers] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [editing, setEditing] = React.useState(null);

      // Tải dữ liệu 1 lần khi component mount
      React.useEffect(() => {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => res.json())
          .then((data) => {
            setUsers(data);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      }, []);

      // Lắng nghe người dùng mới từ props user
      React.useEffect(() => {
        if (user) {
          setUsers((prev) => {
            const nextId = prev.length > 0 ? Math.max(...prev.map((item) => item.id)) + 1 : 1;
            return [...prev, { ...user, id: nextId }];
          });
          onAdded();
        }
      }, [user]);

      // Lọc danh sách theo keyword
      const filteredUsers = users.filter(
        (u) =>
          u.name.toLowerCase().includes(keyword.toLowerCase()) ||
          u.username.toLowerCase().includes(keyword.toLowerCase())
      );

      // Deep Copy khi kích hoạt Sửa
      function editUser(u) {
        setEditing({
          ...u,
          address: {
            street: u.address?.street || "",
            suite: u.address?.suite || "",
            city: u.address?.city || ""
          }
        });
      }

      // Cập nhật state editing khi nhập trên form Sửa
      function handleEditChange(field, value) {
        if (["street", "suite", "city"].includes(field)) {
          setEditing({
            ...editing,
            address: {
              ...editing.address,
              [field]: value
            }
          });
        } else {
          setEditing({
            ...editing,
            [field]: value
          });
        }
      }

      // Lưu sau khi chỉnh sửa
      function saveUser() {
        if (!editing.name.trim() || !editing.username.trim()) {
          alert("Name và Username không được để trống!");
          return;
        }
        setUsers((prev) => prev.map((u) => (u.id === editing.id ? editing : u)));
        setEditing(null);
      }

      // Xóa người dùng trực tiếp bằng filter()
      function removeUser(id) {
        setUsers((prev) => prev.filter((u) => u.id !== id));
      }

      if (loading) {
        return <div className="status-msg">Đang tải dữ liệu người dùng...</div>;
      }

      return (
        <div className="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Họ tên</th>
                <th>Username</th>
                <th>Email</th>
                <th>Địa chỉ</th>
                <th>Số điện thoại</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody>
              {filteredUsers.length === 0 ? (
                <tr>
                  <td colSpan="7" className="status-msg">
                    Không tìm thấy người dùng phù hợp.
                  </td>
                </tr>
              ) : (
                filteredUsers.map((u) => (
                  <tr key={u.id}>
                    <td>{u.id}</td>
                    <td>{u.name}</td>
                    <td>{u.username}</td>
                    <td>{u.email}</td>
                    <td>
                      {[u.address?.street, u.address?.suite, u.address?.city]
                        .filter(Boolean)
                        .join(", ")}
                    </td>
                    <td>{u.phone}</td>
                    <td style={{ whiteSpace: "nowrap" }}>
                      <button className="btn-edit" onClick={() => editUser(u)}>
                        Sửa
                      </button>
                      <button className="btn-delete" onClick={() => removeUser(u.id)}>
                        Xóa
                      </button>
                    </td>
                  </tr>
                ))
              )}
            </tbody>
          </table>

          {/* Modal Form Sửa người dùng (Bước 6 & 8) */}
          {editing && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h4>Chỉnh sửa người dùng (ID: {editing.id})</h4>

                <div className="form-group">
                  <label htmlFor="edit-name">Name *</label>
                  <input
                    id="edit-name"
                    type="text"
                    value={editing.name}
                    onChange={(e) => handleEditChange("name", e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label htmlFor="edit-username">Username *</label>
                  <input
                    id="edit-username"
                    type="text"
                    value={editing.username}
                    onChange={(e) => handleEditChange("username", e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label htmlFor="edit-email">Email</label>
                  <input
                    id="edit-email"
                    type="email"
                    value={editing.email}
                    onChange={(e) => handleEditChange("email", e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label htmlFor="edit-street">Street</label>
                  <input
                    id="edit-street"
                    type="text"
                    value={editing.address.street}
                    onChange={(e) => handleEditChange("street", e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label htmlFor="edit-suite">Suite</label>
                  <input
                    id="edit-suite"
                    type="text"
                    value={editing.address.suite}
                    onChange={(e) => handleEditChange("suite", e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label htmlFor="edit-city">City</label>
                  <input
                    id="edit-city"
                    type="text"
                    value={editing.address.city}
                    onChange={(e) => handleEditChange("city", e.target.value)}
                  />
                </div>

                <div className="form-group">
                  <label htmlFor="edit-phone">Phone</label>
                  <input
                    id="edit-phone"
                    type="text"
                    value={editing.phone}
                    onChange={(e) => handleEditChange("phone", e.target.value)}
                  />
                </div>

                <div className="modal-actions">
                  <button className="btn-cancel" onClick={() => setEditing(null)}>
                    Hủy
                  </button>
                  <button className="btn-save" onClick={saveUser}>
                    Lưu
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // BƯỚC 2: Component gốc App (Quản lý state tập trung & State Lifting)
    function App() {
      const [kw, setKeyword] = React.useState("");
      const [newUser, setNewUser] = React.useState(null);

      return (
        <div className="container">
          <h1>Quản lý người dùng</h1>
          <div className="toolbar">
            <SearchForm onChangeValue={setKeyword} />
            <AddUser onAdd={setNewUser} />
          </div>
          <ResultTable
            keyword={kw}
            user={newUser}
            onAdded={() => setNewUser(null)}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
